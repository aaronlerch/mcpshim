server:
  # socket_path: defaults to $XDG_RUNTIME_DIR/mcpshim.sock (or /tmp/mcpshim-<uid>.sock)
  # db_path: defaults to ~/.local/share/mcpshim/mcpshim.db
  # history_size: defaults to the newest 1000 calls
  # allow_registry_writes: false (default) refuses `add`, `set auth`, and
  #   `remove` from socket clients, because those actions rewrite this file.
  #   Edit this file and run `mcpshim reload` instead, or set it to true to
  #   let anything holding the socket change the registry.

# config is the source of truth for MCP servers and native HTTP services
servers:
  - name: notion
    alias: notion
    transport: http
    url: https://mcp.notion.com/mcp

  - name: example
    alias: example
    transport: sse
    url: https://mcp.example.com/sse
    headers:
      Authorization: Bearer ${TOKEN}
      X-Region: ${REGION:-us-east}

  # Dynamic auth: helper command produces JSON {"Authorization":"Bearer ..."} per connect.
  # Receives MCPSHIM_SERVER_NAME and MCPSHIM_SERVER_URL in env. 10s timeout, no caching.
  - name: internal
    transport: http
    url: https://mcp.internal.example.com
    headers_helper: /opt/bin/get-mcp-auth-headers.sh

  # Local subprocess MCP server (stdio transport).
  - name: filesystem
    alias: fs
    transport: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - /Users/me/projects
    env:
      LOG_LEVEL: info

# Ordinary HTTP APIs can also be exposed as constrained raw or typed tools.
# See configs/http-services.example.yaml and docs/http-services.md.
http_services: []
